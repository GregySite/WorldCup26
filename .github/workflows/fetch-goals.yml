name: Fetch Match Goals

on:
  schedule:
    # ── QF M97: France vs Morocco — Jul 9, 21:00 UTC → 23:25 UTC ──
    - cron: '55,1,7,13,19,25,31,37,43,49 20,21,22,23 9 7 *'
    - cron: '57,3,9,15,21,27,33,39,45,51 20,21,22,23 9 7 *'
    - cron: '59,5,11,17,23,29,35,41,47,53 20,21,22,23 9 7 *'

    # ── QF M98: Spain vs Belgium — Jul 10, 19:00 UTC → 21:25 UTC ──
    - cron: '55,1,7,13,19,25,31,37,43,49 18,19,20,21 10 7 *'
    - cron: '57,3,9,15,21,27,33,39,45,51 18,19,20,21 10 7 *'
    - cron: '59,5,11,17,23,29,35,41,47,53 18,19,20,21 10 7 *'

    # ── QF M99: Norway vs England — Jul 11, 22:00 UTC → Jul 12 00:25 UTC ──
    - cron: '55,1,7,13,19,25,31,37,43,49 21,22,23 11 7 *'
    - cron: '57,3,9,15,21,27,33,39,45,51 21,22,23 11 7 *'
    - cron: '59,5,11,17,23,29,35,41,47,53 21,22,23 11 7 *'
    - cron: '1,7,13,19,25 0 12 7 *'
    - cron: '3,9,15,21,27 0 12 7 *'
    - cron: '5,11,17,23,29 0 12 7 *'

    # ── QF M100: Argentina vs Switzerland — Jul 12, 02:00 UTC → 04:25 UTC ──
    - cron: '55,1,7,13,19,25,31,37,43,49 1,2,3,4 12 7 *'
    - cron: '57,3,9,15,21,27,33,39,45,51 1,2,3,4 12 7 *'
    - cron: '59,5,11,17,23,29,35,41,47,53 1,2,3,4 12 7 *'

    # ── SF M101: Jul 14, 19:00 UTC → 21:25 UTC ──
    - cron: '55,1,7,13,19,25,31,37,43,49 18,19,20,21 14 7 *'
    - cron: '57,3,9,15,21,27,33,39,45,51 18,19,20,21 14 7 *'
    - cron: '59,5,11,17,23,29,35,41,47,53 18,19,20,21 14 7 *'

    # ── SF M102: Jul 15, 19:00 UTC → 21:25 UTC ──
    - cron: '55,1,7,13,19,25,31,37,43,49 18,19,20,21 15 7 *'
    - cron: '57,3,9,15,21,27,33,39,45,51 18,19,20,21 15 7 *'
    - cron: '59,5,11,17,23,29,35,41,47,53 18,19,20,21 15 7 *'

    # ── 3rd M103: Jul 18, 21:00 UTC → 23:25 UTC ──
    - cron: '55,1,7,13,19,25,31,37,43,49 20,21,22,23 18 7 *'
    - cron: '57,3,9,15,21,27,33,39,45,51 20,21,22,23 18 7 *'
    - cron: '59,5,11,17,23,29,35,41,47,53 20,21,22,23 18 7 *'

    # ── Final M104: Jul 19, 19:00 UTC → 21:25 UTC ──
    - cron: '55,1,7,13,19,25,31,37,43,49 18,19,20,21 19 7 *'
    - cron: '57,3,9,15,21,27,33,39,45,51 18,19,20,21 19 7 *'
    - cron: '59,5,11,17,23,29,35,41,47,53 18,19,20,21 19 7 *'

  workflow_dispatch:

jobs:
  fetch-goals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch goals from Zafronix and update scores.js
        env:
          ZAFRONIX_KEY: ${{ secrets.ZAFRONIX_KEY }}
        run: node .github/scripts/fetch-goals.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet api/scores.js || (
            git add api/scores.js &&
            git commit -m "auto: update goals data [skip ci]" &&
            git push
          )
