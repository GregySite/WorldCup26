<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Live Tracker & Predictions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00C853;--green-dim:#003318;
  --gold:#FFD600;--gold-dim:rgba(255,214,0,.12);
  --red:#FF3B30;--blue:#0A84FF;
  --bg:#0A0F0D;--bg2:#111A14;
  --card:#1A2B1E;--card2:#213525;
  --border:#2A4030;--border2:#3A5040;
  --text:#E8F5EC;--text2:#9DB8A5;--text3:#5A7A62;
  --radius:10px;--radius-sm:6px;
}
html{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:16px}

.site-header{background:linear-gradient(160deg,#0E1F12,#0A1A0F);border-bottom:1px solid var(--border);padding:2rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.site-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% -20%,rgba(0,200,83,.15),transparent 70%);pointer-events:none}
.site-header h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2rem,6vw,3.5rem);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);line-height:1;margin-bottom:.4rem}
.site-header .subtitle{font-size:.95rem;color:var(--text2);letter-spacing:.05em}
.header-meta{display:flex;justify-content:center;gap:1.5rem;margin-top:1rem;font-size:.8rem;color:var(--text3);flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:.3rem;vertical-align:middle}
#live-clock{color:var(--text2);font-weight:500}

.feed-bar{font-size:.72rem;padding:.45rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap}
.feed-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.feed-dot.green{background:var(--green)}
.feed-dot.gold{background:var(--gold)}
.feed-dot.grey{background:var(--text3)}

.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);padding:0 1.5rem;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:100}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.8rem 1.1rem;font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

.view{display:none;padding:1.5rem}
.view.active{display:block}

/* GROUPS */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem}
.group-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;background:var(--card2);border-bottom:1px solid var(--border)}
.group-letter{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;color:var(--gold)}
.group-tag{font-size:.6rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}

.standings{width:100%;border-collapse:collapse;font-size:.8rem}
.standings th{padding:.35rem .6rem;color:var(--text3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:.62rem;text-align:center;border-bottom:1px solid var(--border)}
.standings th:nth-child(2){text-align:left}
.standings td{padding:.42rem .6rem;text-align:center;border-bottom:1px solid rgba(42,64,48,.5)}
.standings td:nth-child(2){text-align:left}
.standings tr:last-child td{border-bottom:none}
.standings tr.qualified td:nth-child(2){border-left:2px solid var(--green)}
.standings tr.playoff td:nth-child(2){border-left:2px solid var(--gold)}
.team-cell{display:flex;align-items:center;gap:.4rem;font-size:.8rem}
.flag{font-size:.95rem;line-height:1}
.pts{font-weight:700;font-size:.88rem}

.matches-section{border-top:1px solid var(--border);padding:.5rem 0 .3rem}
.matches-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:.2rem 1rem .35rem;font-weight:600}
.match-block{padding:.5rem .8rem;border-bottom:1px solid rgba(42,64,48,.35)}
.match-block:last-child{border-bottom:none}
.match-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.3rem}
.match-team{font-size:.78rem;font-weight:500}
.match-team.home{text-align:right}
.match-team.away{text-align:left}
.match-center{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:98px}
.match-date-line{font-size:.58rem;color:var(--text3)}
.match-time-line{font-size:.62rem;color:var(--gold);font-weight:600}
.score-wrap{display:flex;align-items:center;gap:3px;cursor:pointer;margin-top:1px}
.score-box{width:26px;height:26px;border-radius:4px;background:var(--bg2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:var(--text);transition:border-color .15s}
.score-box:hover{border-color:var(--green)}
.score-box.live-score{background:var(--green-dim);border-color:var(--green)}
.score-box.manual-score{background:rgba(10,132,255,.15);border-color:var(--blue)}
.score-sep{font-size:.78rem;color:var(--text3)}
.score-source{font-size:.52rem;color:var(--text3);margin-top:1px}
.source-live{color:var(--green)}
.source-manual{color:var(--blue)}
.match-status{font-size:.55rem;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.status-done{background:rgba(0,200,83,.12);color:var(--green)}
.status-live{background:rgba(255,59,48,.2);color:var(--red);animation:pulse 1.5s infinite}
.status-soon{background:rgba(255,214,0,.1);color:var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* PREDICTION ROW */
.pred-line{display:flex;align-items:center;gap:.5rem;margin-top:.5rem;font-size:.62rem}
.pred-tag{color:var(--gold);font-weight:600;white-space:nowrap}
.pred-score{color:var(--text);font-weight:700}
.pred-badge{font-size:.58rem;padding:1px 5px;border-radius:3px;font-weight:700}
.pred-exact{background:rgba(0,200,83,.2);color:var(--green)}
.pred-ok{background:rgba(255,214,0,.15);color:var(--gold)}
.pred-wrong{background:rgba(255,59,48,.12);color:var(--red)}
.prob-bar{flex:1;height:6px;border-radius:4px;overflow:hidden;display:flex;background:var(--bg2);min-width:60px}
.prob-h{background:var(--green);height:100%}
.prob-d{background:var(--text3);height:100%}
.prob-a{background:var(--blue);height:100%}
.prob-legend{display:flex;justify-content:space-between;font-size:.54rem;color:var(--text3);margin-top:2px;padding:0 1px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card2);border:1px solid var(--border2);border-radius:var(--radius);padding:1.5rem;width:min(360px,92vw)}
.modal h3{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text);margin-bottom:.5rem;text-align:center}
.modal-match{text-align:center;font-size:.82rem;color:var(--text2);margin-bottom:.5rem;font-weight:600}
.modal-hint{text-align:center;font-size:.68rem;color:var(--text3);margin-bottom:1rem;line-height:1.5}
.score-row{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:.4rem;margin-bottom:1rem}
.score-input{width:100%;height:46px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border2);color:var(--text);font-size:1.4rem;font-weight:700;text-align:center;font-family:'Barlow Condensed',sans-serif;outline:none;transition:border-color .2s}
.score-input:focus{border-color:var(--green)}
.modal-btns{display:flex;gap:.5rem}
.btn{flex:1;padding:.6rem;border-radius:var(--radius-sm);font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-save{background:var(--green);color:#000}
.btn-cancel{background:var(--bg);color:var(--text2);border:1px solid var(--border2)}
.btn-clear{background:transparent;color:var(--red);border:1px solid rgba(255,59,48,.3);flex:0;padding:.6rem .8rem}

.section-head{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.section-head::after{content:'';flex:1;height:1px;background:var(--border)}

.filter-bar{display:flex;gap:.5rem;margin-bottom:1.1rem;flex-wrap:wrap}
.filter-btn{padding:.3rem .75rem;border-radius:20px;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:var(--green-dim);border-color:var(--green);color:var(--green)}

/* UPCOMING */
.upcoming-list{display:flex;flex-direction:column;gap:.6rem}
.upcoming-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem 1rem;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:.8rem;cursor:pointer;transition:border-color .15s}
.upcoming-item:hover{border-color:var(--border2)}
.upcoming-day{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:800;color:var(--text);line-height:1;text-align:center}
.upcoming-month{font-size:.58rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.upcoming-time{font-size:.68rem;color:var(--gold);margin-top:.2rem;font-weight:600;text-align:center}
.upcoming-match{font-weight:600;font-size:.88rem;color:var(--text)}
.upcoming-meta{font-size:.7rem;color:var(--text2);margin-top:.15rem}
.upcoming-badge{font-size:.58rem;padding:2px 6px;border-radius:3px;background:var(--bg2);border:1px solid var(--border);color:var(--text3);letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.date-divider{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:.2rem 0 .4rem;border-bottom:1px solid var(--border);margin-bottom:.5rem;font-weight:700}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.9rem;margin-bottom:1.5rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem}
.stat-label{font-size:.62rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem}
.stat-value{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;color:var(--gold)}
.stat-sub{font-size:.72rem;color:var(--text2);margin-top:.2rem}

/* KNOCKOUT */
.knockout-outer{overflow-x:auto;padding-bottom:.5rem}
.bracket{display:flex;min-width:880px}
.round{display:flex;flex-direction:column;justify-content:space-around;width:176px;padding:0 .4rem}
.round-title{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);text-align:center;padding:.5rem 0 .7rem;border-bottom:1px solid var(--border);margin-bottom:.8rem;font-weight:700}
.ko-match{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:.4rem;overflow:hidden}
.ko-team{display:flex;align-items:center;justify-content:space-between;padding:.32rem .5rem;border-bottom:1px solid var(--border);gap:.25rem}
.ko-team:last-of-type{border-bottom:none}
.ko-team-name{font-size:.7rem;font-weight:500;color:var(--text2)}
.ko-meta{background:var(--bg2);padding:.2rem .5rem;font-size:.58rem;color:var(--text3);display:flex;justify-content:space-between;border-top:1px solid var(--border)}

.pred-table{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.pred-row{display:flex;align-items:center;justify-content:space-between;padding:.45rem .8rem;border-bottom:1px solid var(--border);font-size:.78rem;gap:.5rem;flex-wrap:wrap}
.pred-row:last-child{border-bottom:none}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@media(max-width:600px){.groups-grid{grid-template-columns:1fr}.view{padding:.8rem}}
</style>
</head>

    </div>
    <div class="modal-btns">

      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-save" onclick="saveMatch()">Save</button>

</div>

["I","26/06","Boston",0,2,21],["I","26/06","Toronto",1,3,21],
["J","28/06","Dallas",3,0,4],["J","28/06","Kansas City",1,2,4],
["K","28/06","Miami",0,2,1],["K","28/06","Atlanta",1,3,1],
["L","27/06","New York",1,0,23],["L","27/06","Philadelphia",3,2,23]
];

// ═══════════════ TIME ═══════════════
const PARIS_OFF=2;
function localTime(ph){
  const lo=-(new Date().getTimezoneOffset()/60);
  return String(((ph+(lo-PARIS_OFF))+24)%24).padStart(2,'0')+':00';
}
function tzName(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){return''}}

const GC={};
const MATCHES=MR.map((m,gi)=>{
  const g=m[0];GC[g]=(GC[g]||0);const li=GC[g]++;
  return{gi,group:g,date:m[1],city:m[2],hi:m[3],ai:m[4],ph:m[5],li,get t(){return localTime(this.ph)}};
});
const GM={};Object.keys(GROUPS).forEach(g=>GM[g]=[]);
MATCHES.forEach(m=>GM[m.group].push(m));
const mid=(g,li)=>g+'-'+li;

// ═══════════════ PREDICTIONS (strength model) ═══════════════
function predict(sH,sA){
  const d=sH-sA;
  return[Math.min(4,Math.max(0,Math.round(1.5+d*.04))),Math.min(4,Math.max(0,Math.round(1.3-d*.04)))];
}
function probs(sH,sA){
  const d=sH-sA,eH=1/(1+Math.pow(10,-d/30));
  const cl=1-Math.abs(eH-.5)*2,pD=Math.round((0.18+0.14*cl)*100);
  let pH=Math.round(eH*(1-pD/100)*100),pA=100-pH-pD;
  if(pA<0){pD+=pA;pA=0}
  return[pH,pD,pA];
}
const PRED={};
MATCHES.forEach(m=>{
  const hT=GROUPS[m.group].teams[m.hi],aT=GROUPS[m.group].teams[m.ai];
  const id=mid(m.group,m.li);
  PRED[id]={s:predict(STR[hT]||70,STR[aT]||70),p:probs(STR[hT]||70,STR[aT]||70)};
});

// ═══════════════ STORAGE ═══════════════
const SK='wc2026_v4';
function load(){try{return JSON.parse(localStorage.getItem(SK))||{live:{},manual:{}}}catch(e){return{live:{},manual:{}}}}
function save(){localStorage.setItem(SK,JSON.stringify(D))}
let D=load();
// manual overrides live
function score(id){return D.manual[id]??D.live[id]??null}
function scoreSource(id){return D.manual[id]?'manual':D.live[id]?'live':null}

// ═══════════════ DATE/STATUS ═══════════════
function pDate(dstr,ph){const[d,mo]=dstr.split('/').map(Number);return new Date(2026,mo-1,d,parseInt(localTime(ph)),0,0)}
function status(m){
  const id=mid(m.group,m.li),sc=score(id);
  if(sc)return'done';
  const diff=pDate(m.date,m.ph)-new Date();
  if(diff<-7200000)return'done';if(diff<0)return'live';if(diff<86400000)return'soon';return'pending';
}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fd(d){const[day,mo]=d.split('/');return parseInt(day)+' '+MON[parseInt(mo)-1]}

function updateClock(){const el=document.getElementById('live-clock');if(el)el.textContent='🕐 '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(updateClock,1000);updateClock();
const tz=tzName();document.getElementById('tz-info').textContent=tz;

// ═══════════════ STANDINGS ═══════════════
function standings(group){
  const g=GROUPS[group];
  const t=g.teams.map((n,i)=>({n,f:g.flags[i],i,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  GM[group].forEach(m=>{
    const sc=score(mid(group,m.li));if(!sc)return;
    const[sh,sa]=sc,h=t[m.hi],a=t[m.ai];
    h.mp++;a.mp++;h.gf+=sh;h.ga+=sa;a.gf+=sa;a.ga+=sh;
    if(sh>sa){h.w++;h.pts+=3;a.l++}else if(sh<sa){a.w++;a.pts+=3;h.l++}else{h.d++;h.pts++;a.d++;a.pts++}
  });
  return t.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}

// ═══════════════ RENDER GROUPS ═══════════════
function renderGroups(){
  const c=document.getElementById('groups-container');c.innerHTML='';
  Object.keys(GROUPS).forEach(group=>{
    const st=standings(group),g=GROUPS[group];
    const card=document.createElement('div');card.className='group-card';
    card.innerHTML=`<div class="group-header"><div class="group-letter">Group ${group}</div><div class="group-tag">Live standings</div></div>`;
    // standings table
    const tbl=document.createElement('table');tbl.className='standings';
    tbl.innerHTML='<thead><tr><th></th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead>';
    const tb=document.createElement('tbody');
    st.forEach((t,r)=>{
      const tr=document.createElement('tr');
      if(r<2)tr.className='qualified';else if(r===2)tr.className='playoff';
      const gd=t.gf-t.ga;
      tr.innerHTML=`<td><span style="color:var(--text3);font-size:.68rem">${r+1}</span></td><td><div class="team-cell"><span class="flag">${t.f}</span>${t.n}</div></td><td>${t.mp}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td style="color:${gd>0?'var(--green)':gd<0?'var(--red)':'var(--text2)'}">${gd>0?'+':''}${gd}</td><td><span class="pts">${t.pts}</span></td>`;
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);card.appendChild(tbl);
    // matches
    const ms=document.createElement('div');ms.className='matches-section';
    ms.innerHTML='<div class="matches-label">Matches &mdash; predictions &amp; results</div>';
    GM[group].forEach(m=>{
      const id=mid(group,m.li),sc=score(id),src=scoreSource(id);
      const pred=PRED[id],st2=status(m);
      const hT=g.teams[m.hi],aT=g.teams[m.ai],hF=g.flags[m.hi],aF=g.flags[m.ai];
      const played=!!sc;
      const stBadge={done:'<span class="match-status status-done">Final</span>',live:'<span class="match-status status-live">Live</span>',soon:'<span class="match-status status-soon">Soon</span>',pending:''}[st2];
      // prediction assessment
      let predBadge='';
      if(played){
        const rr=sc[0]>sc[1]?'H':sc[0]<sc[1]?'A':'D';
        const pr=pred.s[0]>pred.s[1]?'H':pred.s[0]<pred.s[1]?'A':'D';
        if(pred.s[0]===sc[0]&&pred.s[1]===sc[1]) predBadge='<span class="pred-badge pred-exact">✓ exact</span>';
        else if(rr===pr) predBadge='<span class="pred-badge pred-ok">✓ result</span>';
        else predBadge='<span class="pred-badge pred-wrong">✗ wrong</span>';
      }
      const[ph,pd,pa]=pred.p;
      const scoreClass=played?(src==='live'?'live-score':'manual-score'):'';
      const srcLabel=played?(src==='live'?'<span class="score-source source-live">● live</span>':'<span class="score-source source-manual">● manual</span>'):'';
      const blk=document.createElement('div');blk.className='match-block';
      blk.innerHTML=`
        <div class="match-top">
          <div class="match-team home">${hF} ${hT}</div>
          <div class="match-center">
            <div class="match-date-line">${fd(m.date)} · ${m.city}</div>
            <div class="match-time-line">${m.t}</div>
            <div class="score-wrap" onclick="openModal('${id}','${hT}','${aT}','${src||''}',${played?sc[0]:'null'},${played?sc[1]:'null'})">
              <div class="score-box ${scoreClass}">${played?sc[0]:'·'}</div>
              <span class="score-sep">–</span>
              <div class="score-box ${scoreClass}">${played?sc[1]:'·'}</div>
            </div>
            ${srcLabel}
            ${stBadge}
          </div>
          <div class="match-team away">${aT} ${aF}</div>
        </div>
        <div class="pred-line">
          <span class="pred-tag">🔮</span>
          <span class="pred-score">${pred.s[0]}–${pred.s[1]}</span>
          ${predBadge}
          <div class="prob-bar"><div class="prob-h" style="width:${ph}%"></div><div class="prob-d" style="width:${pd}%"></div><div class="prob-a" style="width:${pa}%"></div></div>
        </div>
        <div class="prob-legend"><span>${hT.split(' ')[0]} ${ph}%</span><span>Draw ${pd}%</span><span>${pa}% ${aT.split(' ')[0]}</span></div>`;
      ms.appendChild(blk);
    });
    card.appendChild(ms);c.appendChild(card);
  });
}

// ═══════════════ MODAL ═══════════════
let curId=null;
function openModal(id,h,a,src,sh,sa){
  curId=id;
  document.getElementById('modal-match-label').textContent=`${h} vs ${a}`;
  const hint=src==='live'?'Score loaded live automatically. You can override it manually below.'
    :src==='manual'?'This score was entered manually. Clear it to restore the live score.'
    :'No result yet. Scores appear automatically — or enter one manually here.';
  document.getElementById('modal-hint').textContent=hint;
  document.getElementById('real-home').value=sh!==null&&sh!==undefined&&sh!=='null'?sh:'';
  document.getElementById('real-away').value=sa!==null&&sa!==undefined&&sa!=='null'?sa:'';
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('real-home').focus(),80);
}
function closeModal(){document.getElementById('modal').classList.remove('open');curId=null}
function closeModalOverlay(e){if(e.target.id==='modal')closeModal()}
function saveMatch(){
  if(!curId)return;
  const h=document.getElementById('real-home').value,a=document.getElementById('real-away').value;
  if(h!==''&&a!==''){D.manual[curId]=[+h,+a];save();closeModal();renderGroups();renderStats()}
  else closeModal();
}
function clearMatch(){if(!curId)return;delete D.manual[curId];save();closeModal();renderGroups();renderStats()}

// ═══════════════ UPCOMING ═══════════════
let upF='all';
function filterUpcoming(f,btn){upF=f;document.querySelectorAll('#upcoming-filters .filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderUpcoming()}
function renderUpcoming(){
  const c=document.getElementById('upcoming-container');c.innerHTML='';const now=new Date();
  const bd={};
  MATCHES.forEach(m=>{
    const id=mid(m.group,m.li),st2=status(m),md2=pDate(m.date,m.ph);
    if(upF==='today'){const t=new Date();if(md2.getDate()!==t.getDate()||md2.getMonth()!==t.getMonth())return}
    else if(upF==='week'){const d=md2-now;if(d<-86400000||d>7*86400000)return}
    else if(upF==='pending'&&st2==='done')return;
    else if(upF==='done'&&st2!=='done')return;
    (bd[m.date]=bd[m.date]||[]).push({...m,st2,id});
  });
  const dates=Object.keys(bd).sort((a,b)=>{const[da,ma]=a.split('/').map(Number),[db,mb]=b.split('/').map(Number);return ma!==mb?ma-mb:da-db});
  if(!dates.length){c.innerHTML='<div style="color:var(--text3);text-align:center;padding:2rem;font-size:.85rem">No matches for this filter.</div>';return}
  dates.forEach(date=>{
    const[d,mo]=date.split('/');
    const dh=document.createElement('div');dh.className='date-divider';dh.textContent=parseInt(d)+' '+MON[parseInt(mo)-1]+' 2026';c.appendChild(dh);
    bd[date].forEach(m=>{
      const g=GROUPS[m.group],sc2=score(m.id),pred=PRED[m.id];
      const stMap={done:`<span style="font-size:.62rem;background:rgba(0,200,83,.12);color:var(--green);padding:2px 5px;border-radius:3px;font-weight:700">✓ Final</span>`,live:`<span style="font-size:.62rem;background:rgba(255,59,48,.2);color:var(--red);padding:2px 5px;border-radius:3px;font-weight:700">● Live</span>`,soon:`<span style="font-size:.62rem;background:rgba(255,214,0,.1);color:var(--gold);padding:2px 5px;border-radius:3px;font-weight:700">Soon</span>`,pending:''};
      const it=document.createElement('div');it.className='upcoming-item';
      it.onclick=()=>openModal(m.id,g.teams[m.hi],g.teams[m.ai],scoreSource(m.id)??'',sc2?sc2[0]:null,sc2?sc2[1]:null);
      it.innerHTML=`
        <div><div class="upcoming-day">${d}</div><div class="upcoming-month">${MON[parseInt(mo)-1]}</div><div class="upcoming-time">${m.t}</div></div>
        <div>
          <div class="upcoming-match">${g.flags[m.hi]} ${g.teams[m.hi]} <span style="color:var(--text3);font-weight:400">vs</span> ${g.teams[m.ai]} ${g.flags[m.ai]}</div>
          <div class="upcoming-meta">${m.city} · Group ${m.group}</div>
          <div style="margin-top:.35rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
            ${stMap[m.st2]||''}
            <span style="font-size:.7rem;color:var(--gold)">🔮 ${pred.s[0]}–${pred.s[1]}</span>
            ${sc2?`<span style="font-size:.7rem;color:var(--green);font-weight:700">⚽ ${sc2[0]}–${sc2[1]}</span>`:''}
          </div>
        </div>
        <div class="upcoming-badge">Gr.${m.group}</div>`;
      c.appendChild(it);
    });
  });
}

// ═══════════════ KNOCKOUT ═══════════════

// ═══════════════ STATS ═══════════════
function renderStats(){
  const sc=document.getElementById('stats-container'),pt=document.getElementById('pred-table-container');
  let goals=0,played=0,exact=0,correct=0,total=0,maxG=0,maxM=null;
  MATCHES.forEach(m=>{
    const id=mid(m.group,m.li),s=score(id),p=PRED[id];
    if(s){
      played++;goals+=s[0]+s[1];total++;
      if(s[0]+s[1]>maxG){maxG=s[0]+s[1];maxM={m,s}}
      const rr=s[0]>s[1]?'H':s[0]<s[1]?'A':'D',pr=p.s[0]>p.s[1]?'H':p.s[0]<p.s[1]?'A':'D';
      if(p.s[0]===s[0]&&p.s[1]===s[1])exact++;
      if(rr===pr)correct++;
    }
  });
  const avg=played?(goals/played).toFixed(1):'–',acc=total?Math.round(correct/total*100)+'%':'–';
  const maxStr=maxM?`${GROUPS[maxM.m.group].teams[maxM.m.hi]} ${maxM.s[0]}–${maxM.s[1]} ${GROUPS[maxM.m.group].teams[maxM.m.ai]}`:'–';
  sc.innerHTML=`
    <div class="stat-card"><div class="stat-label">Matches played</div><div class="stat-value">${played}</div><div class="stat-sub">of ${MATCHES.length} group stage</div></div>
    <div class="stat-card"><div class="stat-label">Goals scored</div><div class="stat-value">${goals}</div><div class="stat-sub">${avg} per match</div></div>
    <div class="stat-card"><div class="stat-label">Prediction accuracy</div><div class="stat-value">${acc}</div><div class="stat-sub">${correct}/${total} correct outcomes</div></div>
    <div class="stat-card"><div class="stat-label">Exact score hits</div><div class="stat-value">${exact}</div><div class="stat-sub">perfect scoreline calls</div></div>
    <div class="stat-card"><div class="stat-label">Top scoring match</div><div class="stat-value" style="font-size:${maxM?'1.1rem':'2rem'}">${maxM?maxG+' goals':'–'}</div><div class="stat-sub" style="font-size:.68rem">${maxStr}</div></div>`;
  const rows=[];
  MATCHES.forEach(m=>{
    const id=mid(m.group,m.li),s=score(id),p=PRED[id],g=GROUPS[m.group];
    const hT=g.teams[m.hi],aT=g.teams[m.ai];
    let badge='';
    if(s){
      const rr=s[0]>s[1]?'H':s[0]<s[1]?'A':'D',pr=p.s[0]>p.s[1]?'H':p.s[0]<p.s[1]?'A':'D';
      if(p.s[0]===s[0]&&p.s[1]===s[1])badge='<span class="pred-badge pred-exact">exact ✓</span>';
      else if(rr===pr)badge='<span class="pred-badge pred-ok">result ✓</span>';
      else badge='<span class="pred-badge pred-wrong">wrong ✗</span>';
    }
    rows.push(`<div class="pred-row"><span style="color:var(--text2);font-size:.76rem">Gr.${m.group} · ${hT} vs ${aT}</span><span style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><span style="color:var(--gold)">🔮 ${p.s[0]}–${p.s[1]}</span>${s?`<span>⚽ <b>${s[0]}–${s[1]}</b></span> ${badge}`:'<span style="color:var(--text3);font-size:.72rem">not played</span>'}</span></div>`);
  });
  pt.innerHTML=`<div class="pred-table">${rows.join('')}</div>`;
}

// ═══════════════ LIVE SCORES — openfootball (raw.githubusercontent.com, no auth, CORS open) ═══════════════
const FEED='https://raw.githubusercontent.com/openfootball/world-cup.json/master/2026/worldcup.json';
// Normalise team names from openfootball → our names
const ALIASES={
  'south africa':'South Africa','south korea':'South Korea','korea republic':'South Korea',
  'czech republic':'Czech Republic','czechia':'Czech Republic',
  'bosnia-herzegovina':'Bosnia-Herzegovina','bosnia & herzegovina':'Bosnia-Herzegovina','bosnia and herzegovina':'Bosnia-Herzegovina',
  'united states':'USA','usa':'USA','us':'USA',
  'turkiye':'Turkey','turkey':'Turkey',
  'cote d\'ivoire':'Ivory Coast','ivory coast':'Ivory Coast',
  'ir iran':'Iran','iran':'Iran',
  'cabo verde':'Cape Verde','cape verde':'Cape Verde',
  'dr congo':'DR Congo','congo dr':'DR Congo','democratic republic of the congo':'DR Congo',
  'new zealand':'New Zealand',
  'saudi arabia':'Saudi Arabia',
  'south korea':'South Korea'
};
function norm(s){return(s||'').toLowerCase().trim()}
function mapTeam(raw){return ALIASES[norm(raw)]||raw.split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')}

function findMatchByTeams(t1,t2){
  for(const m of MATCHES){
    const h=GROUPS[m.group].teams[m.hi],a=GROUPS[m.group].teams[m.ai];
    if((h===t1&&a===t2)||(h===t2&&a===t1))return{id:mid(m.group,m.li),home:h};
  }
  return null;
}

function setFeed(state,msg){
  const dot=document.getElementById('feed-dot'),txt=document.getElementById('feed-msg');
  dot.className='feed-dot '+(state==='ok'?'green':state==='warn'?'gold':'grey');
  txt.textContent=msg;
}

let lastFetchOk=false;
async function fetchScores(){
  try{
    // Cache-bust every 5 min with timestamp rounded to 5min
    const t=Math.floor(Date.now()/300000)*300000;
    const r=await fetch(FEED+'?_='+t,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const events=j.matches||[];
    let loaded=0;
    // Clear old live data before re-loading
    D.live={};
    events.forEach(ev=>{
      if(!ev.score||ev.score.ft==null)return;
      const t1=mapTeam(ev.team1),t2=mapTeam(ev.team2);
      const fm=findMatchByTeams(t1,t2);if(!fm)return;
      const[sH,sA]=ev.score.ft;
      D.live[fm.id]=fm.home===t1?[sH,sA]:[sA,sH];
      loaded++;
    });
    save();
    if(loaded>0){
      setFeed('ok',`✓ Live scores connected — ${loaded} result${loaded!==1?'s':''} loaded automatically. Source: openfootball / GitHub. Predictions by strength model.`);
    }else{
      setFeed('warn','✓ Connected — no results yet. Scores will appear here automatically as matches are played.');
    }
    lastFetchOk=true;
    renderGroups();renderStats();
  }catch(e){
    console.warn('Feed error:',e.message);
    if(!lastFetchOk){
      setFeed('grey','⚠ Score feed unreachable (CORS may block localhost). Works on GitHub Pages. Predictions still shown; tap a score to enter manually.');
    }
  }
}

// ═══════════════ VIEWS / INIT ═══════════════
function showView(n){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+n).classList.add('active');
  document.querySelector(`[onclick="showView('${n}')"]`).classList.add('active');
  if(n==='upcoming')renderUpcoming();
  if(n==='knockout')renderKnockout();
  if(n==='stats')renderStats();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&document.getElementById('modal').classList.contains('open'))saveMatch();
});

renderGroups();
fetchScores();
setInterval(fetchScores,300000); // refresh every 5min
