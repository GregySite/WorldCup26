<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00C853;--green-dim:#003318;
  --gold:#FFD600;--gold-dim:rgba(255,214,0,.12);
  --red:#FF3B30;--blue:#0A84FF;
  --bg:#0A0F0D;--bg2:#111A14;
  --card:#1A2B1E;--card2:#213525;
  --border:#2A4030;--border2:#3A5040;
  --text:#E8F5EC;--text2:#9DB8A5;--text3:#5A7A62;
  --r:10px;--rs:6px;
}
html{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif}
.hdr{background:linear-gradient(160deg,#0E1F12,#0A1A0F);border-bottom:1px solid var(--border);padding:1.8rem 1.5rem 1.4rem;text-align:center;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% -20%,rgba(0,200,83,.15),transparent 70%);pointer-events:none}
.hdr h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);line-height:1;margin-bottom:.3rem}
.hdr-sub{font-size:.9rem;color:var(--text2)}
.hdr-meta{display:flex;justify-content:center;gap:1.5rem;margin-top:.9rem;font-size:.75rem;color:var(--text3);flex-wrap:wrap}
#clock{color:var(--text2);font-weight:500}
.feed{font-size:.72rem;padding:.38rem 1rem;text-align:center;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap}
.pill{padding:2px 9px;border-radius:20px;font-weight:700;font-size:.62rem;letter-spacing:.03em}
.pill-live{background:rgba(255,59,48,.2);color:var(--red);animation:blink 1.2s infinite}
.pill-ok{background:var(--green-dim);color:var(--green)}
.pill-wait{background:var(--gold-dim);color:var(--gold)}
.pill-err{background:rgba(255,255,255,.05);color:var(--text3)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);padding:0 1.2rem;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:100}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.75rem 1rem;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.view{display:none;padding:1.2rem}
.view.active{display:block}
/* GROUPS */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.1rem}
.gc2{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.gh{display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;background:var(--card2);border-bottom:1px solid var(--border)}
.gl{font-family:'Barlow Condensed',sans-serif;font-size:1.35rem;font-weight:800;color:var(--gold)}
.gt{font-size:.58rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.stt{width:100%;border-collapse:collapse;font-size:.78rem}
.stt th{padding:.32rem .55rem;color:var(--text3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:.6rem;text-align:center;border-bottom:1px solid var(--border)}
.stt th:nth-child(2){text-align:left}
.stt td{padding:.4rem .55rem;text-align:center;border-bottom:1px solid rgba(42,64,48,.45)}
.stt td:nth-child(2){text-align:left}
.stt tr:last-child td{border-bottom:none}
.stt tr.q td:nth-child(2){border-left:2px solid var(--green)}
.stt tr.p2 td:nth-child(2){border-left:2px solid var(--gold)}
.tc{display:flex;align-items:center;gap:.35rem}
.fl{font-size:.92rem;line-height:1}
.pts{font-weight:700;font-size:.86rem}
/* MATCHES */
.ms{border-top:1px solid var(--border);padding:.4rem 0 .2rem}
.ml{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:.15rem .9rem .3rem;font-weight:600}
.mb{padding:.42rem .75rem;border-bottom:1px solid rgba(42,64,48,.3);transition:background .5s}
.mb:last-child{border-bottom:none}
.mb.flash{background:rgba(0,200,83,.08)}
.mtp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.25rem}
.mtn{font-size:.75rem;font-weight:500}
.mtn.h{text-align:right}
.mtn.a{text-align:left}
.mc{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:94px}
.mdl{font-size:.56rem;color:var(--text3)}
.mtl{font-size:.6rem;color:var(--gold);font-weight:600}
.sw{display:flex;align-items:center;gap:3px;margin-top:1px}
.sb{width:26px;height:26px;border-radius:4px;background:var(--bg2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.84rem;transition:all .3s}
.sb.live{background:rgba(255,59,48,.15);border-color:var(--red);animation:score-pulse 2s infinite}
.sb.done{background:var(--green-dim);border-color:var(--green)}
@keyframes score-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.4)}50%{box-shadow:0 0 0 5px rgba(255,59,48,0)}}
.ss{font-size:.75rem;color:var(--text3)}
.mst{font-size:.53rem;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:1px}
.st-fin{background:rgba(0,200,83,.12);color:var(--green)}
.st-live{background:rgba(255,59,48,.2);color:var(--red);animation:blink 1.2s infinite}
.st-sn{background:rgba(255,214,0,.1);color:var(--gold)}
/* PREDICTION */
.pl{display:flex;align-items:center;gap:.45rem;margin-top:.4rem;font-size:.6rem}
.pt3{color:var(--gold);font-weight:600;white-space:nowrap}
.ps{color:var(--text);font-weight:700}
.pb{font-size:.54rem;padding:1px 5px;border-radius:3px;font-weight:700}
.pe{background:rgba(0,200,83,.2);color:var(--green)}
.po{background:rgba(255,214,0,.15);color:var(--gold)}
.pw{background:rgba(255,59,48,.12);color:var(--red)}
.bar{flex:1;height:6px;border-radius:4px;overflow:hidden;display:flex;background:var(--bg2);min-width:50px}
.bh{background:var(--green);height:100%}
.bd2{background:var(--text3);height:100%}
.ba{background:var(--blue);height:100%}
.bl{display:flex;justify-content:space-between;font-size:.52rem;color:var(--text3);margin-top:1px;padding:0 1px}
/* SCHEDULE */
.sh{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.sh::after{content:'';flex:1;height:1px;background:var(--border)}
.fb{display:flex;gap:.45rem;margin-bottom:1rem;flex-wrap:wrap}
.fb button{padding:.28rem .7rem;border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .15s}
.fb button:hover,.fb button.act{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.ul{display:flex;flex-direction:column;gap:.5rem}
.ui{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.75rem .9rem;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:.7rem;transition:border-color .15s}
.ui.islive{border-color:rgba(255,59,48,.5)}
.ud{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:800;color:var(--text);line-height:1;text-align:center}
.um{font-size:.56rem;color:var(--text3);text-transform:uppercase;text-align:center}
.ut{font-size:.65rem;color:var(--gold);margin-top:.15rem;font-weight:600;text-align:center}
.ub{font-size:.56rem;padding:2px 5px;border-radius:3px;background:var(--bg2);border:1px solid var(--border);color:var(--text3);font-weight:600;white-space:nowrap}
.dd{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:.15rem 0 .35rem;border-bottom:1px solid var(--border);margin-bottom:.4rem;font-weight:700}
/* STATS */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.8rem;margin-bottom:1.3rem}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.85rem}
.slb{font-size:.6rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.25rem}
.sv{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:800;color:var(--gold)}
.ssub{font-size:.7rem;color:var(--text2);margin-top:.15rem}
.ptb{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.pr{display:flex;align-items:center;justify-content:space-between;padding:.42rem .75rem;border-bottom:1px solid var(--border);font-size:.76rem;gap:.5rem;flex-wrap:wrap}
.pr:last-child{border-bottom:none}
/* KNOCKOUT */
.ko{overflow-x:auto;padding-bottom:.5rem}
.br{display:flex;min-width:860px}
.ro{display:flex;flex-direction:column;justify-content:space-around;width:172px;padding:0 .4rem}
.rt{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);text-align:center;padding:.4rem 0 .6rem;border-bottom:1px solid var(--border);margin-bottom:.7rem;font-weight:700}
.km{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:.35rem;overflow:hidden}
.kt{display:flex;align-items:center;justify-content:space-between;padding:.3rem .45rem;border-bottom:1px solid var(--border)}
.kt:last-of-type{border-bottom:none}
.kmeta{background:var(--bg2);padding:.18rem .45rem;font-size:.56rem;color:var(--text3);display:flex;justify-content:space-between;border-top:1px solid var(--border)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@media(max-width:600px){.gg{grid-template-columns:1fr}.view{padding:.8rem}}
</style>
</head>
<body>

<header class="hdr">
  <h1>⚽ World Cup 2026 ⚽</h1>
  <div class="hdr-sub">USA · Canada · Mexico &nbsp;·&nbsp; June 11 – July 19, 2026</div>
  <div class="hdr-meta">
    <span>48 teams · 12 groups</span>
    <span id="clock"></span>
    <span id="tz"></span>
  </div>
</header>

<div class="feed">
  <span class="pill pill-wait" id="fpill">⏳ Loading</span>
  <span id="fmsg" style="color:var(--text2)">Connecting to live scores…</span>
  <span id="fupd" style="color:var(--text3)"></span>
</div>

<nav class="tabs">
  <button class="tab active" onclick="V('groups')">Groups</button>
  <button class="tab" onclick="V('sched')">Schedule</button>
  <button class="tab" onclick="V('ko')">Knockout</button>
  <button class="tab" onclick="V('stats')">Stats</button>
</nav>

<div id="view-groups" class="view active"><div class="gg" id="gc"></div></div>
<div id="view-sched" class="view">
  <div class="fb" id="fb">
    <button class="act" onclick="UF('all',this)">All</button>
    <button onclick="UF('today',this)">Today</button>
    <button onclick="UF('week',this)">This week</button>
    <button onclick="UF('live',this)">🔴 Live</button>
    <button onclick="UF('soon',this)">Upcoming</button>
    <button onclick="UF('done',this)">Finished</button>
  </div>
  <div class="ul" id="ul"></div>
</div>
<div id="view-ko" class="view"><div class="sh">Knockout bracket</div><div class="ko"><div class="br" id="br"></div></div></div>
<div id="view-stats" class="view">
  <div class="sh">Tournament stats</div>
  <div class="sg" id="sg"></div>
  <div class="sh">Predictions vs results</div>
  <div id="pt"></div>
</div>



<script>
// ══ VERCEL ENDPOINT — change this after deployment ══
// e.g. 'https://world-cup26-xi.vercel.app/api/scores'
const SCORES_ENDPOINT = 'https://world-cup26-xi.vercel.app/api/scores';

// ══ GROUPS & TEAMS ══
const G={
  A:{t:["Mexico","South Africa","South Korea","Czech Republic"],f:["🇲🇽","🇿🇦","🇰🇷","🇨🇿"]},
  B:{t:["Canada","Bosnia-Herzegovina","Qatar","Switzerland"],f:["🇨🇦","🇧🇦","🇶🇦","🇨🇭"]},
  C:{t:["Brazil","Morocco","Haiti","Scotland"],f:["🇧🇷","🇲🇦","🇭🇹","🏴󠁧󠁢󠁳󠁣󠁴󠁿"]},
  D:{t:["USA","Paraguay","Australia","Turkey"],f:["🇺🇸","🇵🇾","🇦🇺","🇹🇷"]},
  E:{t:["Germany","Curaçao","Ivory Coast","Ecuador"],f:["🇩🇪","🇨🇼","🇨🇮","🇪🇨"]},
  F:{t:["Netherlands","Japan","Sweden","Tunisia"],f:["🇳🇱","🇯🇵","🇸🇪","🇹🇳"]},
  G:{t:["Belgium","Egypt","Iran","New Zealand"],f:["🇧🇪","🇪🇬","🇮🇷","🇳🇿"]},
  H:{t:["Spain","Cape Verde","Saudi Arabia","Uruguay"],f:["🇪🇸","🇨🇻","🇸🇦","🇺🇾"]},
  I:{t:["France","Senegal","Iraq","Norway"],f:["🇫🇷","🇸🇳","🇮🇶","🇳🇴"]},
  J:{t:["Argentina","Algeria","Austria","Jordan"],f:["🇦🇷","🇩🇿","🇦🇹","🇯🇴"]},
  K:{t:["Portugal","DR Congo","Uzbekistan","Colombia"],f:["🇵🇹","🇨🇩","🇺🇿","🇨🇴"]},
  L:{t:["England","Croatia","Ghana","Panama"],f:["🏴󠁧󠁢󠁥󠁮󠁧󠁿","🇭🇷","🇬🇭","🇵🇦"]}
};
const STR={"Mexico":78,"South Africa":66,"South Korea":73,"Czech Republic":72,"Canada":74,"Bosnia-Herzegovina":70,"Qatar":64,"Switzerland":79,"Brazil":90,"Morocco":81,"Haiti":55,"Scotland":71,"USA":76,"Paraguay":70,"Australia":71,"Turkey":78,"Germany":87,"Curaçao":57,"Ivory Coast":75,"Ecuador":76,"Netherlands":86,"Japan":78,"Sweden":73,"Tunisia":68,"Belgium":84,"Egypt":73,"Iran":74,"New Zealand":61,"Spain":91,"Cape Verde":60,"Saudi Arabia":64,"Uruguay":83,"France":90,"Senegal":79,"Iraq":62,"Norway":80,"Argentina":92,"Algeria":73,"Austria":77,"Jordan":63,"Portugal":86,"DR Congo":68,"Uzbekistan":65,"Colombia":83,"England":87,"Croatia":80,"Ghana":72,"Panama":62};

const MR=[
  ["A","11/06","Mexico",0,1,21],["A","12/06","Guadalajara",2,3,4],
  ["B","12/06","Toronto",0,1,21],["B","13/06","San Francisco",3,2,21],
  ["C","14/06","New York",0,1,0],["C","14/06","Boston",2,3,3],
  ["D","13/06","Los Angeles",0,1,3],["D","14/06","Vancouver",2,3,6],
  ["E","14/06","Houston",0,1,19],["E","15/06","Philadelphia",2,3,1],
  ["F","14/06","Dallas",0,1,22],["F","15/06","Monterrey",2,3,4],
  ["G","15/06","Seattle",0,1,21],["G","16/06","Los Angeles",2,3,3],
  ["H","15/06","Atlanta",0,1,18],["H","16/06","Miami",3,2,0],
  ["I","16/06","New York",0,1,21],["I","17/06","Boston",2,3,0],
  ["J","17/06","Kansas City",0,1,3],["J","17/06","San Francisco",2,3,6],
  ["K","17/06","Houston",0,1,19],["K","18/06","Mexico",2,3,4],
  ["L","17/06","Dallas",0,1,22],["L","18/06","Toronto",2,3,1],
  ["A","18/06","Atlanta",3,1,18],["A","19/06","Guadalajara",0,2,3],
  ["B","18/06","Los Angeles",1,3,21],["B","19/06","Vancouver",0,2,0],
  ["C","20/06","Boston",3,0,0],["C","20/06","Philadelphia",1,2,2],
  ["D","19/06","Seattle",0,2,21],["D","20/06","San Francisco",3,1,5],
  ["E","20/06","Toronto",0,2,22],["E","21/06","Kansas City",1,3,2],
  ["F","20/06","Houston",0,2,19],["F","21/06","Monterrey",3,1,6],
  ["G","21/06","Los Angeles",0,2,21],["G","22/06","Vancouver",3,1,3],
  ["H","21/06","Atlanta",0,2,18],["H","22/06","Miami",3,1,0],
  ["I","22/06","Philadelphia",0,2,23],["I","23/06","New York",3,1,2],
  ["J","22/06","Dallas",0,2,19],["J","23/06","San Francisco",3,1,5],
  ["K","23/06","Houston",0,2,19],["K","24/06","Guadalajara",3,1,4],
  ["L","23/06","Boston",0,2,22],["L","24/06","Toronto",3,1,1],
  ["A","25/06","Mexico",3,0,3],["A","25/06","Monterrey",1,2,3],
  ["B","24/06","Vancouver",1,0,21],["B","24/06","Seattle",3,2,21],
  ["C","25/06","Miami",3,0,0],["C","25/06","Atlanta",1,2,0],
  ["D","26/06","Los Angeles",3,0,4],["D","26/06","San Francisco",1,2,4],
  ["E","25/06","New York",0,2,22],["E","25/06","Philadelphia",1,3,22],
  ["F","26/06","Kansas City",3,0,1],["F","26/06","Dallas",1,2,1],
  ["G","27/06","Vancouver",1,0,5],["G","27/06","Seattle",3,2,5],
  ["H","27/06","Guadalajara",1,0,2],["H","27/06","Houston",3,2,2],
  ["I","26/06","Boston",0,2,21],["I","26/06","Toronto",1,3,21],
  ["J","28/06","Dallas",3,0,4],["J","28/06","Kansas City",1,2,4],
  ["K","28/06","Miami",0,2,1],["K","28/06","Atlanta",1,3,1],
  ["L","27/06","New York",1,0,23],["L","27/06","Philadelphia",3,2,23]
];

// ══ TIME ══
const PO=2;
function lt(ph){const lo=-(new Date().getTimezoneOffset()/60);return String(((ph+(lo-PO))+24)%24).padStart(2,'0')+':00'}
try{document.getElementById('tz').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
setInterval(()=>{const e=document.getElementById('clock');if(e)e.textContent='🕐 '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);

// ══ BUILD MATCHES ══
const GC={};
const MATCHES=MR.map((m,gi)=>{
  const g=m[0];GC[g]=(GC[g]||0);const li=GC[g]++;
  return{gi,g,date:m[1],city:m[2],hi:m[3],ai:m[4],ph:m[5],li,get t(){return lt(this.ph)}};
});
const GM={};Object.keys(G).forEach(g=>GM[g]=[]);
MATCHES.forEach(m=>GM[m.g].push(m));
const mid=(g,li)=>g+'-'+li;

// ══ PREDICTIONS ══
function pred(h,a){const d=h-a;return[Math.min(4,Math.max(0,Math.round(1.5+d*.04))),Math.min(4,Math.max(0,Math.round(1.3-d*.04)))]}
function probs(h,a){
  const d=h-a,eH=1/(1+Math.pow(10,-d/30)),cl=1-Math.abs(eH-.5)*2,pD=Math.round((0.18+0.14*cl)*100);
  let pH=Math.round(eH*(1-pD/100)*100),pA=100-pH-pD;
  return[Math.max(0,pH),Math.max(0,pD),Math.max(0,pA)];
}
const PRED={};
MATCHES.forEach(m=>{
  const id=mid(m.g,m.li),h=STR[G[m.g].t[m.hi]]||70,a=STR[G[m.g].t[m.ai]]||70;
  PRED[id]={s:pred(h,a),p:probs(h,a)};
});

// ══ STATE ══
let LIVE={matches:{},live:[],minutes:{}};
function sc(id){return LIVE.matches[id]??null}
function isLive(id){return(LIVE.live||[]).includes(id)}
function matchMinute(id){return LIVE.minutes?.[id]??null}

// ══ STATUS ══
function pd(d,ph){const[day,mo]=d.split('/').map(Number);return new Date(2026,mo-1,day,parseInt(lt(ph)),0,0)}
function mst(m){
  const id=mid(m.g,m.li);
  if(isLive(id))return'live';
  if(sc(id))return'done';
  const df=pd(m.date,m.ph)-new Date();
  if(df<-7200000)return'done';if(df<86400000)return'soon';return'pending';
}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fd(d){const[day,mo]=d.split('/');return parseInt(day)+' '+MON[parseInt(mo)-1]}

// ══ STANDINGS ══
function stnd(group){
  const g=G[group];
  const t=g.t.map((n,i)=>({n,f:g.f[i],mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  GM[group].forEach(m=>{
    const s=sc(mid(group,m.li));if(!s)return;
    const[sh,sa]=s,h=t[m.hi],a=t[m.ai];
    h.mp++;a.mp++;h.gf+=sh;h.ga+=sa;a.gf+=sa;a.ga+=sh;
    if(sh>sa){h.w++;h.pts+=3;a.l++}else if(sh<sa){a.w++;a.pts+=3;h.l++}else{h.d++;h.pts++;a.d++;a.pts++}
  });
  return t.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}

// ══ RENDER GROUPS ══
function RG(){
  const c=document.getElementById('gc');c.innerHTML='';
  Object.keys(G).forEach(group=>{
    const st=stnd(group),g=G[group];
    const card=document.createElement('div');card.className='gc2';
    card.innerHTML=`<div class="gh"><div class="gl">Group ${group}</div><div class="gt">Live standings</div></div>`;
    const tbl=document.createElement('table');tbl.className='stt';
    tbl.innerHTML='<thead><tr><th></th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead>';
    const tb=document.createElement('tbody');
    st.forEach((t,r)=>{
      const tr=document.createElement('tr');
      if(r<2)tr.className='q';else if(r===2)tr.className='p2';
      const gd=t.gf-t.ga;
      tr.innerHTML=`<td><span style="color:var(--text3);font-size:.65rem">${r+1}</span></td><td><div class="tc"><span class="fl">${t.f}</span>${t.n}</div></td><td>${t.mp}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td style="color:${gd>0?'var(--green)':gd<0?'var(--red)':'var(--text2)'}">${gd>0?'+':''}${gd}</td><td><span class="pts">${t.pts}</span></td>`;
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);card.appendChild(tbl);
    const ms=document.createElement('div');ms.className='ms';
    ms.innerHTML='<div class="ml">Matches · predictions & results</div>';
    GM[group].forEach(m=>{
      const id=mid(group,m.li),s=sc(id),live=isLive(id),p=PRED[id],st2=mst(m);
      const hT=g.t[m.hi],aT=g.t[m.ai],hF=g.f[m.hi],aF=g.f[m.ai];
      const played=!!s;
      const minute=matchMinute(id);
      const stBadge={
        done:'<span class="mst st-fin">FT</span>',
        live:`<span class="mst st-live">● ${minute?minute+`'`:'Live'}</span>`,
        soon:'<span class="mst st-sn">Soon</span>',
        pending:''
      }[st2]||'';
      // Match progress bar (live only)
      const pct=live&&minute?Math.min(100,Math.round((Math.min(minute,90)/90)*100)):0;
      const progressBar=live?`<div style="width:100%;height:3px;background:var(--border2);border-radius:2px;margin-top:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--red);border-radius:2px;transition:width .5s"></div></div>`:'';

      let pb='';
      if(played&&!live){
        const rr=s[0]>s[1]?'H':s[0]<s[1]?'A':'D',pr=p.s[0]>p.s[1]?'H':p.s[0]<p.s[1]?'A':'D';
        if(p.s[0]===s[0]&&p.s[1]===s[1])pb='<span class="pb pe">✓ exact</span>';
        else if(rr===pr)pb='<span class="pb po">✓</span>';
        else pb='<span class="pb pw">✗</span>';
      }
      const[ph,pd2,pa]=p.p;
      const bc=played?(live?'live':'done'):'';
      const blk=document.createElement('div');blk.className='mb';blk.id='b-'+id;
      blk.innerHTML=`
        <div class="mtp">
          <div class="mtn h">${hF} ${hT}</div>
          <div class="mc">
            <div class="mdl">${fd(m.date)} · ${m.city}</div>
            <div class="mtl">${m.t}</div>
            <div class="sw">
              <div class="sb ${bc}">${played?s[0]:'·'}</div>
              <span class="ss">–</span>
              <div class="sb ${bc}">${played?s[1]:'·'}</div>
            </div>
            ${stBadge}
            ${progressBar}
          </div>
          <div class="mtn a">${aT} ${aF}</div>
        </div>
        <div class="pl">
          <span class="pt3">🔮</span>
          <span class="ps">${p.s[0]}–${p.s[1]}</span>
          ${pb}
          <div class="bar"><div class="bh" style="width:${ph}%"></div><div class="bd2" style="width:${pd2}%"></div><div class="ba" style="width:${pa}%"></div></div>
        </div>
        <div class="bl"><span>${hT.split(' ')[0]} ${ph}%</span><span>Draw ${pd2}%</span><span>${pa}% ${aT.split(' ')[0]}</span></div>`;
      ms.appendChild(blk);
    });
    card.appendChild(ms);c.appendChild(card);
  });
}

// ══ SCHEDULE ══
let uf='all';
function UF(f,btn){uf=f;document.querySelectorAll('#fb button').forEach(b=>b.classList.remove('act'));btn.classList.add('act');RU()}
function RU(){
  const c=document.getElementById('ul');c.innerHTML='';const now=new Date();
  const bd={};
  MATCHES.forEach(m=>{
    const id=mid(m.g,m.li),st2=mst(m),md2=pd(m.date,m.ph);
    if(uf==='today'){const t=new Date();if(md2.getDate()!==t.getDate()||md2.getMonth()!==t.getMonth())return}
    else if(uf==='week'){const df=md2-now;if(df<-86400000||df>7*86400000)return}
    else if(uf==='live'&&st2!=='live')return;
    else if(uf==='soon'&&(st2==='done'||st2==='live'))return;
    else if(uf==='done'&&st2!=='done')return;
    (bd[m.date]=bd[m.date]||[]).push({...m,st2,id});
  });
  const dates=Object.keys(bd).sort((a,b)=>{const[da,ma]=a.split('/').map(Number),[db,mb]=b.split('/').map(Number);return ma!==mb?ma-mb:da-db});
  if(!dates.length){c.innerHTML='<div style="color:var(--text3);text-align:center;padding:2rem;font-size:.85rem">No matches for this filter.</div>';return}
  dates.forEach(date=>{
    const[d,mo]=date.split('/');
    const dh=document.createElement('div');dh.className='dd';dh.textContent=parseInt(d)+' '+MON[parseInt(mo)-1]+' 2026';c.appendChild(dh);
    bd[date].forEach(m=>{
      const g=G[m.g],s=sc(m.id),p=PRED[m.id],live=isLive(m.id);
      const stMap={
        done:`<span style="font-size:.6rem;background:rgba(0,200,83,.12);color:var(--green);padding:2px 5px;border-radius:3px;font-weight:700">✓ FT</span>`,
        live:`<span style="font-size:.6rem;background:rgba(255,59,48,.2);color:var(--red);padding:2px 5px;border-radius:3px;font-weight:700;animation:blink 1.2s infinite">● Live</span>`,
        soon:`<span style="font-size:.6rem;background:rgba(255,214,0,.1);color:var(--gold);padding:2px 5px;border-radius:3px;font-weight:700">Soon</span>`,
        pending:''
      };
      const it=document.createElement('div');it.className='ui'+(live?' islive':'');
      it.innerHTML=`
        <div><div class="ud">${d}</div><div class="um">${MON[parseInt(mo)-1]}</div><div class="ut">${m.t}</div></div>
        <div>
          <div style="font-weight:600;font-size:.86rem">${g.f[m.hi]} ${g.t[m.hi]} <span style="color:var(--text3);font-weight:400">vs</span> ${g.t[m.ai]} ${g.f[m.ai]}</div>
          <div style="font-size:.68rem;color:var(--text2);margin-top:.12rem">${m.city} · Group ${m.g}</div>
          <div style="margin-top:.3rem;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap">
            ${stMap[m.st2]||''}
            <span style="font-size:.68rem;color:var(--gold)">🔮 ${p.s[0]}–${p.s[1]}</span>
            ${s?`<span style="font-size:.68rem;color:${live?'var(--red)':'var(--green)'};font-weight:700">${live?'● ':'⚽ '}${s[0]}–${s[1]}</span>`:''}
          </div>
        </div>
        <div class="ub">Gr.${m.g}</div>`;
      c.appendChild(it);
    });
  });
}

// ══ KNOCKOUT ══
function RK(){
  const c=document.getElementById('br');c.innerHTML='';
  const rds=['Round of 16','Quarter-finals','Semi-finals','Final','3rd place'];
  const dt=[
    [{l:'1E vs 3(A/B/C/D/F)',d:'Jun 29'},{l:'1I vs 3(C/D/F/G/H)',d:'Jun 30'},{l:'2A vs 2B',d:'Jun 28'},{l:'1F vs 2C',d:'Jun 28'},{l:'2K vs 2L',d:'Jul 2'},{l:'1H vs 2J',d:'Jul 2'},{l:'1D vs 3(B/E/F/I/J)',d:'Jul 1'},{l:'1G vs 3(A/E/H/I/J)',d:'Jul 1'}],
    [{l:'W1 vs W2',d:'Jul 4'},{l:'W3 vs W4',d:'Jul 4'},{l:'W5 vs W6',d:'Jul 6'},{l:'W7 vs W8',d:'Jul 6'}],
    [{l:'QF1 vs QF2',d:'Jul 9'},{l:'QF3 vs QF4',d:'Jul 10'}],
    [{l:'🏆 Final · New York',d:'Jul 19'}],[{l:'3rd place match',d:'Jul 18'}]
  ];
  rds.forEach((rt,ri)=>{
    const col=document.createElement('div');col.className='ro';col.innerHTML=`<div class="rt">${rt}</div>`;
    (dt[ri]||[]).forEach(m=>{col.innerHTML+=`<div class="km"><div class="kt"><span style="font-size:.62rem;color:var(--text3);font-style:italic">TBD</span></div><div class="kt"><span style="font-size:.62rem;color:var(--text3);font-style:italic">TBD</span></div><div class="kmeta"><span>${m.l}</span><span>${m.d}</span></div></div>`});
    c.appendChild(col);
  });
}

// ══ STATS ══
function RS(){
  const se=document.getElementById('sg'),pt=document.getElementById('pt');
  let goals=0,played=0,exact=0,correct=0,liveNow=(LIVE.live||[]).length,maxG=0,maxM=null;
  MATCHES.forEach(m=>{
    const id=mid(m.g,m.li),s=sc(id),p=PRED[id];
    if(!s)return;played++;goals+=s[0]+s[1];
    if(s[0]+s[1]>maxG){maxG=s[0]+s[1];maxM={m,s}}
    const rr=s[0]>s[1]?'H':s[0]<s[1]?'A':'D',pr=p.s[0]>p.s[1]?'H':p.s[0]<p.s[1]?'A':'D';
    if(p.s[0]===s[0]&&p.s[1]===s[1])exact++;if(rr===pr)correct++;
  });
  const avg=played?(goals/played).toFixed(1):'–',acc=played?Math.round(correct/played*100)+'%':'–';
  const mx=maxM?`${G[maxM.m.g].t[maxM.m.hi]} ${maxM.s[0]}–${maxM.s[1]} ${G[maxM.m.g].t[maxM.m.ai]}`:'–';
  se.innerHTML=`
    <div class="sc"><div class="slb">Matches played</div><div class="sv">${played}</div><div class="ssub">of ${MATCHES.length} group stage</div></div>
    <div class="sc"><div class="slb">Live now</div><div class="sv" style="color:${liveNow?'var(--red)':'var(--gold)'}">${liveNow}</div><div class="ssub">${liveNow?liveNow+' match'+(liveNow>1?'es':'')+' in progress':'no match live'}</div></div>
    <div class="sc"><div class="slb">Goals scored</div><div class="sv">${goals}</div><div class="ssub">${avg} per match</div></div>
    <div class="sc"><div class="slb">Prediction accuracy</div><div class="sv">${acc}</div><div class="ssub">${correct}/${played} correct outcomes</div></div>
    <div class="sc"><div class="slb">Exact score hits</div><div class="sv">${exact}</div><div class="ssub">perfect calls</div></div>
    <div class="sc"><div class="slb">Top scoring match</div><div class="sv" style="font-size:${maxM?'1.1rem':'1.9rem'}">${maxM?maxG+' goals':'–'}</div><div class="ssub" style="font-size:.66rem">${mx}</div></div>`;
  const rows=[];
  MATCHES.forEach(m=>{
    const id=mid(m.g,m.li),s=sc(id),p=PRED[id],g=G[m.g],live=isLive(id);
    if(!s)return;
    const h=g.t[m.hi],a=g.t[m.ai];
    const rr=s[0]>s[1]?'H':s[0]<s[1]?'A':'D',pr=p.s[0]>p.s[1]?'H':p.s[0]<p.s[1]?'A':'D';
    const badge=live?'':p.s[0]===s[0]&&p.s[1]===s[1]?'<span class="pb pe">exact ✓</span>':rr===pr?'<span class="pb po">✓</span>':'<span class="pb pw">✗</span>';
    rows.push(`<div class="pr"><span style="color:var(--text2);font-size:.74rem">Gr.${m.g} · ${h} vs ${a}</span><span style="display:flex;gap:.45rem;align-items:center;flex-wrap:wrap"><span style="color:var(--gold)">🔮 ${p.s[0]}–${p.s[1]}</span><span style="color:${live?'var(--red)':'var(--green)'};font-weight:700">${live?'● ':''} ${s[0]}–${s[1]}</span>${badge}</span></div>`);
  });
  pt.innerHTML=rows.length?`<div class="ptb">${rows.join('')}</div>`:'<div style="color:var(--text3);text-align:center;padding:1.4rem;font-size:.8rem">Results appear here automatically as matches are played.</div>';
}

// ══ FETCH FROM VERCEL ══
let prevHash='',retryDelay=30000;
async function fetchScores(){
  try{
    const r=await fetch(SCORES_ENDPOINT+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    LIVE=j;
    const liveNow=(j.live||[]).length,done=Object.keys(j.matches||{}).length;
    const pill=document.getElementById('fpill'),msg=document.getElementById('fmsg'),upd=document.getElementById('fupd');
    if(liveNow>0){
      pill.className='pill pill-live';pill.textContent=`● ${liveNow} LIVE`;
      msg.textContent=`${done} result${done!==1?'s':''} loaded`;
    }else if(done>0){
      pill.className='pill pill-ok';pill.textContent='✓ Live';
      msg.textContent=`${done} result${done!==1?'s':''} loaded`;
    }else{
      pill.className='pill pill-ok';pill.textContent='✓ Connected';
      msg.textContent='No results yet — scores appear automatically';
    }
    upd.textContent='· '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const hash=JSON.stringify(j);
    if(hash!==prevHash){
      prevHash=hash;RG();RS();
      if(document.getElementById('view-sched').classList.contains('active'))RU();
      // Flash live blocks
      (j.live||[]).forEach(id=>{const el=document.getElementById('b-'+id);if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2000)}});
    }
    retryDelay=30000;
  }catch(e){
    const pill=document.getElementById('fpill');
    pill.className='pill pill-err';pill.textContent='⚠ Offline';
    document.getElementById('fmsg').textContent='Score feed unavailable — will retry automatically';
    console.warn('Scores fetch error:',e.message);
    retryDelay=Math.min(retryDelay*2,300000);
  }
}

// ══ SMART REFRESH — 30s when live, 5min otherwise ══
function scheduleNext(){
  const hasLive=(LIVE.live||[]).length>0;
  setTimeout(()=>{fetchScores().then(scheduleNext)},hasLive?30000:300000);
}

// ══ VIEWS ══
function V(n){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+n).classList.add('active');
  document.querySelector(`[onclick="V('${n}')"]`).classList.add('active');
  if(n==='sched')RU();if(n==='ko')RK();if(n==='stats')RS();
}
// ══ INIT ══
RG();
fetchScores().then(scheduleNext);
</script>
