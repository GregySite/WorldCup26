<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00C853;--gd:#003318;
  --gold:#FFD600;--gdim:rgba(255,214,0,.12);
  --red:#FF3B30;--blue:#0A84FF;
  --bg:#0A0F0D;--bg2:#111A14;
  --card:#1A2B1E;--card2:#213525;
  --border:#2A4030;--bdr2:#3A5040;
  --text:#E8F5EC;--t2:#9DB8A5;--t3:#5A7A62;
  --r:10px;--rs:6px;
}
html{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px}
/* WRAPPER — max width on desktop */
.wrap{max-width:1400px;margin:0 auto;width:100%}
.hdr .wrap,.feed .wrap{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.5rem}
/* HEADER */
.hdr{background:linear-gradient(160deg,#0E1F12,#0A1A0F);border-bottom:1px solid var(--border);padding:1.6rem 1.2rem 1.2rem;text-align:center;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% -20%,rgba(0,200,83,.15),transparent 70%);pointer-events:none}
.hdr h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.8rem,5vw,3rem);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);line-height:1;margin-bottom:.25rem}
.hdr-sub{font-size:.88rem;color:var(--t2)}
.hdr-meta{display:flex;justify-content:center;gap:1.2rem;margin-top:.8rem;font-size:.72rem;color:var(--t3);flex-wrap:wrap;align-items:center}
#clock{color:var(--t2);font-weight:600}
.ver{font-size:.58rem;background:var(--gd);color:var(--green);padding:2px 6px;border-radius:3px;font-weight:700;letter-spacing:.06em}
/* COUNTDOWN */
.cdown{background:var(--card2);border-bottom:1px solid var(--border);padding:.55rem 1rem;text-align:center;font-size:.75rem;color:var(--t2)}
.cdown b{color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:700}
.cdown .match-name{color:var(--text);font-weight:600}
/* FEED BAR */
.feed{font-size:.7rem;padding:.35rem 1rem;text-align:center;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap}
.pill{padding:2px 9px;border-radius:20px;font-weight:700;font-size:.6rem;letter-spacing:.03em}
.pill-live{background:rgba(255,59,48,.2);color:var(--red);animation:blink 1.2s infinite}
.pill-ok{background:var(--gd);color:var(--green)}
.pill-wait{background:var(--gdim);color:var(--gold)}
.pill-err{background:rgba(255,255,255,.05);color:var(--t3)}
/* NOTIF BUTTON */
.notif-btn{font-size:.62rem;padding:2px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--bdr2);background:var(--card);color:var(--t3);transition:all .15s;white-space:nowrap}
.notif-btn.on{border-color:var(--green);color:var(--green);background:var(--gd)}
.notif-btn.off{border-color:var(--bdr2);color:var(--t3)}
/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);padding:0 1rem;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:100}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.7rem .9rem;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover{color:var(--t2)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.view{display:none;padding:1rem}
.view.active{display:block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* GROUPS */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;max-width:1400px;margin:0 auto}
.gc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.gh{display:flex;align-items:center;justify-content:space-between;padding:.55rem .85rem;background:var(--card2);border-bottom:1px solid var(--border)}
.gl{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:800;color:var(--gold)}
.gt{font-size:.58rem;color:var(--t3);letter-spacing:.1em;text-transform:uppercase}
/* STANDINGS TABLE */
.st{width:100%;border-collapse:collapse;font-size:.76rem}
.st th{padding:.3rem .5rem;color:var(--t3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:.58rem;text-align:center;border-bottom:1px solid var(--border)}
.st th:nth-child(2){text-align:left}
.st td{padding:.38rem .5rem;text-align:center;border-bottom:1px solid rgba(42,64,48,.45)}
.st td:nth-child(2){text-align:left}
.st tr:last-child td{border-bottom:none}
.st tr.q td:nth-child(2){border-left:2px solid var(--green)}
.st tr.p td:nth-child(2){border-left:2px solid var(--gold)}
.tc{display:flex;align-items:center;gap:.3rem}
.pts{font-weight:700;font-size:.84rem}
/* MATCHES */
.ms{border-top:1px solid var(--border);padding:.35rem 0 .15rem}
.ml{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:.12rem .85rem .28rem;font-weight:600}
.mb{padding:.38rem .7rem;border-bottom:1px solid rgba(42,64,48,.3);transition:background .5s}
.mb:last-child{border-bottom:none}
.mb.flash{background:rgba(0,200,83,.08)}
.mt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.2rem}
.mtn{font-size:.73rem;font-weight:500}
.mtn.h{text-align:right}
.mtn.a{text-align:left}
.mc{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:90px}
.mdl{font-size:.54rem;color:var(--t3)}
.mtl{font-size:.58rem;color:var(--gold);font-weight:600}
.sw{display:flex;align-items:center;gap:3px;margin-top:1px}
.sb{width:24px;height:24px;border-radius:4px;background:var(--bg2);border:1px solid var(--bdr2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;transition:all .3s}
.sb.live{background:rgba(255,59,48,.15);border-color:var(--red);animation:score-pulse 2s infinite}
.sb.done{background:var(--gd);border-color:var(--green)}
@keyframes score-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.4)}50%{box-shadow:0 0 0 5px rgba(255,59,48,0)}}
.ss{font-size:.72rem;color:var(--t3)}
.mst{font-size:.52rem;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:1px}
.ft{background:rgba(0,200,83,.12);color:var(--green)}
.lv{background:rgba(255,59,48,.2);color:var(--red);animation:blink 1.2s infinite}
.sn{background:rgba(255,214,0,.1);color:var(--gold)}
/* PROGRESS BAR */
.prog{width:100%;height:3px;background:var(--bdr2);border-radius:2px;margin-top:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--red);border-radius:2px;transition:width .5s}
/* MATCH EVENTS (goals/cards) */
.evts{font-size:.58rem;color:var(--t2);margin-top:.3rem;display:flex;flex-direction:column;gap:2px}
.evt{display:flex;align-items:center;gap:.3rem;padding:1px 0}
.evt-min{color:var(--t3);min-width:22px;text-align:right}
.evt-icon{font-size:.65rem}
.evt-name{color:var(--t2)}
.evt-pen{color:var(--t3);font-size:.52rem}
/* PREDICTION */
.pl{display:flex;align-items:center;gap:.4rem;margin-top:.38rem;font-size:.58rem}
.pt{color:var(--gold);font-weight:600;white-space:nowrap}
.ps{color:var(--text);font-weight:700}
.pbg{font-size:.52rem;padding:1px 4px;border-radius:3px;font-weight:700}
.pe{background:rgba(0,200,83,.2);color:var(--green)}
.po{background:rgba(255,214,0,.15);color:var(--gold)}
.pw{background:rgba(255,59,48,.12);color:var(--red)}
.bar{flex:1;height:5px;border-radius:4px;overflow:hidden;display:flex;background:var(--bg2);min-width:40px}
.bh{background:var(--green);height:100%}
.bd{background:var(--t3);height:100%}
.ba{background:var(--blue);height:100%}
.bleg{display:flex;justify-content:space-between;font-size:.5rem;color:var(--t3);margin-top:1px;padding:0 1px}
/* SECTION HEAD */
.sh{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text);margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
.sh::after{content:'';flex:1;height:1px;background:var(--border)}
/* FILTER BAR */
.fb{display:flex;gap:.4rem;margin-bottom:.9rem;flex-wrap:wrap}
.fb button{padding:.25rem .65rem;border-radius:20px;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--t2);transition:all .15s}
.fb button:hover,.fb button.act{background:var(--gd);border-color:var(--green);color:var(--green)}
/* SCHEDULE */
.ul{display:flex;flex-direction:column;gap:.5rem}
.ui{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .85rem;display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:.65rem;transition:border-color .15s}
.ui.islive{border-color:rgba(255,59,48,.5)}
.ud{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:800;color:var(--text);line-height:1;text-align:center}
.um{font-size:.55rem;color:var(--t3);text-transform:uppercase;text-align:center}
.ut{font-size:.62rem;color:var(--gold);margin-top:.12rem;font-weight:600;text-align:center}
.ub{font-size:.55rem;padding:2px 5px;border-radius:3px;background:var(--bg2);border:1px solid var(--border);color:var(--t3);font-weight:600;white-space:nowrap}
.dd{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:.12rem 0 .3rem;border-bottom:1px solid var(--border);margin-bottom:.4rem;font-weight:700}
.now-line{display:flex;align-items:center;gap:.5rem;margin:.45rem 0}
.now-line div{flex:1;height:2px;background:var(--red);border-radius:2px}
.now-line span{font-size:.62rem;font-weight:700;color:var(--red);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding:2px 8px;background:rgba(255,59,48,.12);border-radius:20px;border:1px solid rgba(255,59,48,.35)}
/* SCORERS */
.scorer-list{display:flex;flex-direction:column;gap:.4rem}
.scorer-row{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:.55rem .85rem;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:.6rem}
.scorer-rank{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:800;color:var(--t3);text-align:center}
.scorer-rank.top{color:var(--gold)}
.scorer-name{font-weight:600;font-size:.84rem;color:var(--text)}
.scorer-team{font-size:.65rem;color:var(--t2);margin-top:1px}
.scorer-goals{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:800;color:var(--gold);text-align:right;line-height:1}
.scorer-sub{font-size:.58rem;color:var(--t3);text-align:right}
/* STATS */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem;margin-bottom:1.2rem}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.8rem}
.slb{font-size:.58rem;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.22rem}
.sv{font-family:'Barlow Condensed',sans-serif;font-size:1.8rem;font-weight:800;color:var(--gold)}
.ssub{font-size:.68rem;color:var(--t2);margin-top:.12rem}
.pt2{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.pr{display:flex;align-items:center;justify-content:space-between;padding:.4rem .72rem;border-bottom:1px solid var(--border);font-size:.74rem;gap:.5rem;flex-wrap:wrap}
.pr:last-child{border-bottom:none}
/* KNOCKOUT */
.ko{overflow-x:auto;padding-bottom:.5rem}
.br{display:flex;min-width:860px}
.ro{display:flex;flex-direction:column;justify-content:space-around;width:172px;padding:0 .35rem}
.rt{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);text-align:center;padding:.4rem 0 .6rem;border-bottom:1px solid var(--border);margin-bottom:.7rem;font-weight:700}
.km{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:.35rem;overflow:hidden}
.kt{display:flex;align-items:center;justify-content:space-between;padding:.28rem .42rem;border-bottom:1px solid var(--border)}
.kt:last-of-type{border-bottom:none}
.kmeta{background:var(--bg2);padding:.18rem .42rem;font-size:.54rem;color:var(--t3);display:flex;justify-content:space-between;border-top:1px solid var(--border)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
@media(min-width:1200px){
  .gg{grid-template-columns:repeat(4,1fr)}
  .view{padding:1.2rem 2rem}
  .tabs{padding:0 2rem}
  .hdr{padding:2rem 2rem 1.5rem}
  .cdown,.feed{padding-left:2rem;padding-right:2rem}
  .ul{max-width:900px;margin:0 auto}
  .scorer-list{max-width:700px;margin:0 auto}
  .sg{max-width:1200px;margin:0 auto 1.2rem}
  #pt .pt2{max-width:900px;margin:0 auto}
}
@media(min-width:900px) and (max-width:1199px){
  .gg{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:580px){.gg{grid-template-columns:1fr}.view{padding:.75rem}}
</style>

// ══ PREDICTIONS ══
function pred(h,a){const d=h-a;return[Math.min(4,Math.max(0,Math.round(1.5+d*.04))),Math.min(4,Math.max(0,Math.round(1.3-d*.04)))]}
function probs(h,a){
  const d=h-a,eH=1/(1+Math.pow(10,-d/30)),cl=1-Math.abs(eH-.5)*2,pD=Math.round((0.18+0.14*cl)*100);
  let pH=Math.round(eH*(1-pD/100)*100),pA=100-pH-pD;
  return[Math.max(0,pH),Math.max(0,pD),Math.max(0,pA)];
}
const PRED={};
MATCHES.forEach(m=>{
  const id=mid(m.g,m.li),h=STR[G[m.g].t[m.hi]]||70,a=STR[G[m.g].t[m.ai]]||70;
  PRED[id]={s:pred(h,a),p:probs(h,a)};
});

// ══ STATUS / DATE ══
function pd(d,ph){const[day,mo]=d.split('/').map(Number);return new Date(2026,mo-1,day,parseInt(lt(ph)),0,0)}
function mst(m){
  const id=mid(m.g,m.li);
  // API data is authoritative — if we have a score and it's not live, it's done
  if(isLive(id))return'live';
  if(sc(id))return'done';
  // Fallback to time-based status (3h window for "done" to catch matches not yet in API)
  const df=pd(m.date,m.ph)-new Date();
  if(df<-10800000)return'done';  // more than 3h ago → assume done
  if(df<0)return'live';          // started but no score yet → show as live
  if(df<86400000)return'soon';
  return'pending';
}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fd(d){const[day,mo]=d.split('/');return parseInt(day)+' '+MON[parseInt(mo)-1]}

// ══ COUNTDOWN ══
function updateCountdown(){
  const now=new Date();
  const next=MATCHES.filter(m=>mst(m)==='soon'||mst(m)==='pending').map(m=>({m,d:pd(m.date,m.ph)})).filter(x=>x.d>now).sort((a,b)=>a.d-b.d)[0];
  const el=document.getElementById('cdown');
  if(!el)return;
  if(!next){el.style.display='none';return;}
  el.style.display='block';
  const diff=next.d-now;
  const h=Math.floor(diff/3600000),mn=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  const g=G[next.m.g],hT=g.t[next.m.hi],aT=g.t[next.m.ai];
  el.innerHTML=`Next match: <span class="match-name">${g.f[next.m.hi]} ${hT} vs ${aT} ${g.f[next.m.ai]}</span> — <b>${h>0?h+'h ':''}</b><b>${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}</b>`;
}
setInterval(updateCountdown,1000);

function toggleNotif(){

    return;
  }
  if(Notification.permission==='denied'){

    return;
  }
  // permission === 'default' — request it
  Notification.requestPermission().then(p=>{
    notifEnabled=(p==='granted');
    updateNotifBtn();
    if(notifEnabled){
      notify('Notifications enabled','You will be alerted for goals, red cards and match events.','🔔');
    } else {

function notify(title,body,icon='⚽'){
  if(!notifEnabled||Notification.permission!=='granted')return;
  try{new Notification(icon+' '+title,{body,icon:'/favicon.ico',badge:'/favicon.ico',silent:false});}catch(e){}
}
function checkNotifications(newData){
  // Match starting
  (newData.live||[]).forEach(id=>{
    if(!(id in prevMatches)){
      const m=MATCHES.find(x=>mid(x.g,x.li)===id);
      if(m){const g=G[m.g];notify('Match started!',`${g.t[m.hi]} vs ${g.t[m.ai]} — Kick off!`,'⏱️');}
    }
  });
  // Goals
  Object.keys(newData.goals||{}).forEach(id=>{
    const newGoals=newData.goals[id]||[];
    const oldGoals=prevMatches[id]||[];
    if(newGoals.length>oldGoals.length){
      const newGoal=newGoals[newGoals.length-1];
      const type=newGoal.type==='OWN_GOAL'?'⚽ OG':newGoal.type==='PENALTY'?'⚽ P':'⚽';
      const s=newData.matches[id];
      const m=MATCHES.find(x=>mid(x.g,x.li)===id);
      const scoreStr=s?`${s[0]}–${s[1]}`:'';
      notify(`Goal! ${scoreStr}`,`${newGoal.min}' ${newGoal.name} (${newGoal.team})`,type);
    }
    prevMatches[id]=newGoals;
  });
  // Red cards
  Object.keys(newData.cards||{}).forEach(id=>{
    const newC=(newData.cards[id]||[]).filter(c=>c.card==='RED_CARD'||c.card==='YELLOW_RED_CARD');
    const oldC=(prevCards[id]||[]).filter(c=>c.card==='RED_CARD'||c.card==='YELLOW_RED_CARD');
    if(newC.length>oldC.length){
      const c=newC[newC.length-1];
      notify('Red card!',`${c.min}' ${c.name} (${c.team})`,'🔴');
    }
    prevCards[id]=newData.cards[id]||[];
  });
  // Match finished
  Object.keys(newData.matches||{}).forEach(id=>{
    if(!(LIVE.live||[]).includes(id)&&(prevMatches[id]||newData.matches[id])){
      const wasLive=(LIVE.live||[]).includes(id);
      if(wasLive){
        const s=newData.matches[id];
        const m=MATCHES.find(x=>mid(x.g,x.li)===id);
        if(m){const g=G[m.g];notify('Full time!',`${g.t[m.hi]} ${s[0]}–${s[1]} ${g.t[m.ai]}`,'✅');}
      }
    }
  });
}

// ══ STANDINGS ══
function stnd(group){
  const g=G[group];
  const t=g.t.map((n,i)=>({n,f:g.f[i],mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  GM[group].forEach(m=>{
    const s=sc(mid(group,m.li));if(!s)return;
    const[sh,sa]=s,h=t[m.hi],a=t[m.ai];
    h.mp++;a.mp++;h.gf+=sh;h.ga+=sa;a.gf+=sa;a.ga+=sh;
    if(sh>sa){h.w++;h.pts+=3;a.l++}else if(sh<sa){a.w++;a.pts+=3;h.l++}else{h.d++;h.pts++;a.d++;a.pts++}
  });
  return t.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}

// ══ SCHEDULE ══
let uf='all';
function UF(f,btn){uf=f;document.querySelectorAll('#fb button').forEach(b=>b.classList.remove('act'));btn.classList.add('act');RU()}

  const c=document.getElementById('ul');c.innerHTML='';const now=new Date();
  const bd={};
  MATCHES.forEach(m=>{
    const id=mid(m.g,m.li),st2=mst(m),md2=pd(m.date,m.ph);
    if(uf==='today'){const t=new Date();if(md2.getDate()!==t.getDate()||md2.getMonth()!==t.getMonth())return}
    else if(uf==='week'){const df=md2-now;if(df<-86400000||df>7*86400000)return}
    else if(uf==='live'&&st2!=='live')return;
    else if(uf==='soon'&&(st2==='done'||st2==='live'))return;
    else if(uf==='done'&&st2!=='done')return;
    (bd[m.date]=bd[m.date]||[]).push({...m,st2,id});
  });
  // Sort within each date: done first, then live, then upcoming
  const statusOrder={done:0,live:1,soon:2,pending:3};
  Object.keys(bd).forEach(date=>{
    bd[date].sort((a,b)=>{
      const so=statusOrder[a.st2]-statusOrder[b.st2];

      const allEvents = [

      it.innerHTML=`
        <div><div class="ud">${d}</div><div class="um">${MON[parseInt(mo)-1]}</div><div class="ut">${m.t}</div></div>
        <div style="min-width:0">
          <div style="font-weight:600;font-size:.84rem">${g.f[m.hi]} ${g.t[m.hi]} <span style="color:var(--t3);font-weight:400">vs</span> ${g.t[m.ai]} ${g.f[m.ai]}</div>
          <div style="font-size:.66rem;color:var(--t2);margin-top:.1rem">${m.city} · Group ${m.g}</div>
          <div style="margin-top:.28rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
            ${stMap[m.st2]||''}
            ${mn&&live?`<span style="font-size:.6rem;color:var(--red);font-weight:700">${mn}'</span>`:''}
            <span style="font-size:.66rem;color:var(--gold)">🔮 ${p.s[0]}–${p.s[1]}</span>
            ${s?`<span style="font-size:.66rem;color:${live?'var(--red)':'var(--green)'};font-weight:700">${live?'● ':'⚽ '}${s[0]}–${s[1]}</span>`:''}
          </div>
          ${eventsHtml}
          ${progressHtml}
        </div>
        <div class="ub">Gr.${m.g}</div>`;
      c.appendChild(it);
    });
  });
  if(nowEl)setTimeout(()=>nowEl.scrollIntoView({behavior:'smooth',block:'center'}),120);
}

// ══ SCORERS ══
function RScorers(){
  const c=document.getElementById('scorer-list');
  const sc2=LIVE.scorers||[];
  if(!sc2.length){c.innerHTML='<div style="color:var(--t3);text-align:center;padding:2rem;font-size:.82rem">No scorer data yet — loads once matches are played.</div>';return}
  c.innerHTML=sc2.map((s,i)=>{
    const top=i<3;
    const rankColors=['🥇','🥈','🥉'];
    return`<div class="scorer-row">
      <div class="scorer-rank${top?' top':''}">${top?rankColors[i]:i+1}</div>
      <div>
        <div class="scorer-name">${s.name}</div>
        <div class="scorer-team">${s.team}</div>
      </div>
      <div>
        <div class="scorer-goals">${s.goals}</div>
        <div class="scorer-sub">${s.assists?s.assists+' ast':''} ${s.penalties?'('+s.penalties+' P)':''}</div>
      </div>
    </div>`;
  }).join('');
}

// ══ KNOCKOUT ══
function RK(){
  const c=document.getElementById('br');c.innerHTML='';
  const rds=['Round of 16','Quarter-finals','Semi-finals','Final','3rd place'];
  const dt=[
    [{l:'1E vs 3(A/B/C/D/F)',d:'Jun 29'},{l:'1I vs 3(C/D/F/G/H)',d:'Jun 30'},{l:'2A vs 2B',d:'Jun 28'},{l:'1F vs 2C',d:'Jun 28'},{l:'2K vs 2L',d:'Jul 2'},{l:'1H vs 2J',d:'Jul 2'},{l:'1D vs 3(B/E/F/I/J)',d:'Jul 1'},{l:'1G vs 3(A/E/H/I/J)',d:'Jul 1'}],
    [{l:'W1 vs W2',d:'Jul 4'},{l:'W3 vs W4',d:'Jul 4'},{l:'W5 vs W6',d:'Jul 6'},{l:'W7 vs W8',d:'Jul 6'}],
    [{l:'QF1 vs QF2',d:'Jul 9'},{l:'QF3 vs QF4',d:'Jul 10'}],
    [{l:'🏆 Final · New York',d:'Jul 19'}],[{l:'3rd place match',d:'Jul 18'}]
  ];
  rds.forEach((rt,ri)=>{
    const col=document.createElement('div');col.className='ro';col.innerHTML=`<div class="rt">${rt}</div>`;
    (dt[ri]||[]).forEach(m=>{col.innerHTML+=`<div class="km"><div class="kt"><span style="font-size:.6rem;color:var(--t3);font-style:italic">TBD</span></div><div class="kt"><span style="font-size:.6rem;color:var(--t3);font-style:italic">TBD</span></div><div class="kmeta"><span>${m.l}</span><span>${m.d}</span></div></div>`});
    c.appendChild(col);
  });
}

// ══ STATS ══
function RS(){
  const se=document.getElementById('sg'),pt=document.getElementById('pt');
  let goals=0,played=0,exact=0,correct=0,liveNow=(LIVE.live||[]).length,maxG=0,maxM=null,yellowCards=0,redCards=0;
  MATCHES.forEach(m=>{
    const id=mid(m.g,m.li),s=sc(id),p=PRED[id];
    if(!s)return;played++;goals+=s[0]+s[1];
    if(s[0]+s[1]>maxG){maxG=s[0]+s[1];maxM={m,s}}
    const rr=s[0]>s[1]?'H':s[0]<s[1]?'A':'D',pr=p.s[0]>p.s[1]?'H':p.s[0]<p.s[1]?'A':'D';
    if(p.s[0]===s[0]&&p.s[1]===s[1])exact++;if(rr===pr)correct++;
    (LIVE.cards?.[id]||[]).forEach(c=>{if(c.card==='YELLOW_CARD')yellowCards++;else if(c.card==='RED_CARD'||c.card==='YELLOW_RED_CARD')redCards++;});
  });
  const avg=played?(goals/played).toFixed(1):'–',acc=played?Math.round(correct/played*100)+'%':'–';
  const mx=maxM?`${G[maxM.m.g].t[maxM.m.hi]} ${maxM.s[0]}–${maxM.s[1]} ${G[maxM.m.g].t[maxM.m.ai]}`:'–';
  se.innerHTML=`
    <div class="sc"><div class="slb">Matches played</div><div class="sv">${played}</div><div class="ssub">of ${MATCHES.length} group stage</div></div>
    <div class="sc"><div class="slb">Live now</div><div class="sv" style="color:${liveNow?'var(--red)':'var(--gold)'}">${liveNow}</div><div class="ssub">${liveNow?liveNow+' in progress':'no match live'}</div></div>
    <div class="sc"><div class="slb">Goals scored</div><div class="sv">${goals}</div><div class="ssub">${avg} per match</div></div>
    <div class="sc"><div class="slb">Prediction accuracy</div><div class="sv">${acc}</div><div class="ssub">${correct}/${played} correct</div></div>
    <div class="sc"><div class="slb">Exact score hits</div><div class="sv">${exact}</div><div class="ssub">perfect calls</div></div>
    <div class="sc"><div class="slb">🟨 Yellow cards</div><div class="sv">${yellowCards}</div><div class="ssub">${redCards} red card${redCards!==1?'s':''}</div></div>
    <div class="sc"><div class="slb">Top scoring match</div><div class="sv" style="font-size:${maxM?'1rem':'1.8rem'}">${maxM?maxG+' goals':'–'}</div><div class="ssub" style="font-size:.62rem">${mx}</div></div>`;
  const rows=[];
  MATCHES.forEach(m=>{
    const id=mid(m.g,m.li),s=sc(id),p=PRED[id],g=G[m.g],live=isLive(id);
    if(!s)return;
    const h=g.t[m.hi],a=g.t[m.ai];
    const rr=s[0]>s[1]?'H':s[0]<s[1]?'A':'D',pr=p.s[0]>p.s[1]?'H':p.s[0]<p.s[1]?'A':'D';
    const badge=live?'':p.s[0]===s[0]&&p.s[1]===s[1]?'<span class="pbg pe">exact ✓</span>':rr===pr?'<span class="pbg po">✓</span>':'<span class="pbg pw">✗</span>';
    rows.push(`<div class="pr"><span style="color:var(--t2);font-size:.72rem">Gr.${m.g} · ${h} vs ${a}</span><span style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap"><span style="color:var(--gold)">🔮 ${p.s[0]}–${p.s[1]}</span><span style="color:${live?'var(--red)':'var(--green)'};font-weight:700">${live?'● ':''} ${s[0]}–${s[1]}</span>${badge}</span></div>`);
  });
  pt.innerHTML=rows.length?`<div class="pt2">${rows.join('')}</div>`:'<div style="color:var(--t3);text-align:center;padding:1.2rem;font-size:.8rem">Results appear here automatically as matches are played.</div>';
}

// ══ FETCH ══
let prevHash='';
async function fetchScores(){
  try{
    const r=await fetch(ENDPOINT+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    // Check notifications before updating state
    try{checkNotifications(j);}catch(ne){console.warn('notif error:',ne.message);}
    LIVE=j;
    const liveNow=(j.live||[]).length,done=Object.keys(j.matches||{}).length;
    const pill=document.getElementById('fpill'),msg=document.getElementById('fmsg'),upd=document.getElementById('fupd');
    if(liveNow>0){pill.className='pill pill-live';pill.textContent=`● ${liveNow} LIVE`;msg.textContent=`${done} results loaded`;}
    else if(done>0){pill.className='pill pill-ok';pill.textContent='✓ Live';msg.textContent=`${done} results loaded`;}
    else{pill.className='pill pill-ok';pill.textContent='✓ Connected';msg.textContent='No results yet — scores appear automatically';}
    upd.textContent='· '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const hash=JSON.stringify({m:j.matches,l:j.live,g:j.goals,c:j.cards,s:j.scorers});
    if(hash!==prevHash){
      prevHash=hash;
      RG();RS();
      if(document.getElementById('view-sched').classList.contains('active'))RU();
      if(document.getElementById('view-scorers').classList.contains('active'))RScorers();
      (j.live||[]).forEach(id=>{const el=document.getElementById('b-'+id);if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2000)}});
    }
  }catch(e){
    const pill=document.getElementById('fpill');
    pill.className='pill pill-err';pill.textContent='⚠ Offline';
    document.getElementById('fmsg').textContent='Score feed unavailable — will retry';
    console.error('Fetch error:',e.message, e.stack);
  }
}

// ══ SMART REFRESH ══
function scheduleNext(){
  const hasLive=(LIVE.live||[]).length>0;
  setTimeout(()=>fetchScores().then(scheduleNext),hasLive?30000:300000);
}

// ══ VIEWS ══
function V(n){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+n).classList.add('active');
  document.querySelector(`[onclick="V('${n}')"]`).classList.add('active');
  PREFS.tab=n;savePrefs(PREFS);
  if(n==='sched')RU();
  if(n==='scorers')RScorers();
  if(n==='ko')RK();
  if(n==='stats')RS();
}

// ══ INIT ══
V(PREFS.tab||'groups');
updateCountdown();
updateNotifBtn(); // restore notification button state
fetchScores().then(scheduleNext);
</script>
